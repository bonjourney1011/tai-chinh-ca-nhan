name: monthly-refresh
on:
  schedule:
    - cron: "17 1 1 * *"   # 08:17 ICT on the 1st
  workflow_dispatch:
    inputs:
      sources:
        description: "Comma list: stocks,gold,fx,macro,global or all"
        default: "all"
      push_sheet:
        description: "Write result tabs to the Google Sheet"
        type: boolean
        default: true
permissions:
  contents: write
  issues: write
concurrency:
  group: monthly-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Asia/Ho_Chi_Minh
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen
      - name: Fetch, compute, push
        env:
          GSPREAD_SA_JSON: ${{ secrets.GSPREAD_SA_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          TIINGO_TOKEN: ${{ secrets.TIINGO_TOKEN }}
        run: |
          PUSH_FLAG="--push"
          if [ "${{ inputs.push_sheet }}" = "false" ]; then PUSH_FLAG="--no-push"; fi
          uv run taichinh run-monthly --sources "${{ inputs.sources || 'all' }}" $PUSH_FLAG
      - name: Commit market data
        run: |
          git config user.name "taichinh-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/market
          if git diff --cached --quiet; then echo "no data changes"; exit 0; fi
          git commit -m "data: monthly refresh $(date +%Y-%m)"
          git push
      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Monthly refresh failed $(date +%Y-%m-%d)" \
            --body "See run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --label ops || true
