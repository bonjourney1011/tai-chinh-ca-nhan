<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self'; connect-src https://script.google.com https://script.googleusercontent.com; img-src 'self' data:; manifest-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Tài chính của anh</title>
  <meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/base-tokens-and-layout.css">
  <link rel="stylesheet" href="assets/css/overview-cards-and-lists.css">
  <link rel="stylesheet" href="assets/css/action-forms.css">
  <link rel="stylesheet" href="assets/css/finance-screens.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" integrity="sha512-CQBWl4fJHWbryGE+Pc7UAxWMUMNMWzWxF4SQo9CgkJIN1kx6djDQZjh3Y8SZ1d+6I+1zze6Z7kHXO7q3UyZAWw==" crossorigin="anonymous" referrerpolicy="no-referrer" defer></script>
  <script type="module" src="assets/js/app-main.js"></script>
</head>
<body>
  <header class="topbar">
    <div>
      <h1 class="topbar__title">Tài chính của anh</h1>
      <span class="topbar__date" id="today-label"></span>
    </div>
    <div class="topbar__actions">
      <button class="icon-btn" id="refresh" type="button" aria-label="Tải lại số liệu">↻</button>
      <button class="icon-btn" id="settings" type="button" aria-label="Cài đặt">⚙</button>
    </div>
  </header>

  <main class="wrap">
    <section class="gate" id="gate" hidden></section>
    <div id="view-overview" hidden></div>
    <div id="view-goals" hidden></div>
    <div id="view-ledger" hidden></div>
    <div id="view-budget" hidden></div>
    <div id="view-market" hidden></div>
  </main>

  <nav class="tabbar" id="tabbar" role="tablist" hidden>
    <button type="button" data-tab="overview" role="tab" aria-selected="true"><span aria-hidden="true">📊</span>Tổng quan</button>
    <button type="button" data-tab="goals" role="tab" aria-selected="false"><span aria-hidden="true">🎯</span>Mục tiêu</button>
    <button type="button" data-tab="ledger" role="tab" aria-selected="false"><span aria-hidden="true">✍️</span>Ghi sổ</button>
    <button type="button" data-tab="budget" role="tab" aria-selected="false"><span aria-hidden="true">🧾</span>Ngân sách</button>
    <button type="button" data-tab="market" role="tab" aria-selected="false"><span aria-hidden="true">💹</span>Thị trường</button>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
